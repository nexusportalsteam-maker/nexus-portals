<main>
<section class="dk fill" data-nex="Say hi. I will pass it on."><div class="w">
  <h1 class="pt">Have a bigger idea?</h1>
  <div class="split">
    <form id="cf">
      <input name="name" placeholder="Your name" maxlength="80" required>
      <input name="email" type="email" placeholder="Email address" maxlength="120" required>
      <textarea name="message" rows="5" placeholder="Tell us what you want to build" maxlength="2000" required></textarea>
      <button class="btn">Send message</button>
      <p id="cs" role="status"></p>
    </form>
    <div><h3>Reach us directly</h3><ul id="cl"><li>Loading…</li></ul></div>
  </div>
</div></section>
</main>
<footer class="dk"><div class="w">© <span id="yr"></span> Nexus. Press Ctrl K to jump around, or poke the little guy.</div></footer>
